name: Release assets

# When a GitHub release is published, builds the AppImage and attaches it to the release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 wget file zlib1g-dev \
            qt6-base-dev qt6-base-dev-tools libgl-dev
      - name: Build AppImage
        env:
          QMAKE: /usr/lib/qt6/bin/qmake
        run: packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build-appimage/*.AppImage
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build-appimage/*.AppImage --clobber
